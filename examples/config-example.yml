# Modpoll Configuration File

# Schema:
# name: <string>  # Device name (no spaces)
# description: <string>  # Optional device description
# type: <string>        # Optional device type (e.g. sensor, actuator)
# manufacturer: <string> # Optional manufacturer name
# datasheet: <string>   # Optional datasheet URL/path
# pollers:       # Array of data pollers for different Modbus function codes
#   - type: <string>  # Function code type:
#                    # coil (FC1/5/15) - single bit read/write
#                    # discrete_input (FC2) - single bit read-only
#                    # holding_register (FC3/6/16) - 16-bit read/write
#                    # input_register (FC4) - 16-bit read-only
#     start_address: <int>        # Starting address (0-65535)
#     size: <int>                 # Number of registers/coils to poll
#     byte_order: <endian_type>   # Byte order within 16-bit word
#     word_order: <endian_type>   # Word order for 32-bit values
#     references:                 # Array of register/coil references
#       - [name, address, dtype, access?, unit?, scale?]
#         # name: Reference identifier (no spaces)
#         # address: Register/coil address (0-65535, within poller range)
#         # dtype: Data type:
#         #   - bit0-bit15: Individual bits in register
#         #   - uint16/int16: 16-bit unsigned/signed integer
#         #   - uint32/int32: 32-bit unsigned/signed integer (uses 2 registers)
#         #   - float32: 32-bit IEEE 754 float (uses 2 registers)
#         #   - stringXXX: String with XXX characters (uses ceil(XXX/2) resters)
#         # access: Optional access mode (r=read-only, w=write-only, rw=read-write), defaults to r
#         # unit: Optional engineering unit for the value
#         # scale: Optional multiplier for raw register value

# Example:
name: modsim
description: A Modbus TCP online simulator
type: sensor
manufacturer: topmaker
datasheet: null
pollers:
  - type: coil
    start_address: 0
    size: 16
    byte_order: big_endian
    word_order: big_endian
    references:
      - ["coil_01", 0, "bit0"]
      - ["coil_02", 0, "bit1"]
      - ["coil_03", 0, "bit2"]
      - ["coil_04", 0, "bit3"]
      - ["coil_05", 0, "bit4"]
      - ["coil_06", 0, "bit5"]
      - ["coil_07", 0, "bit6"]
      - ["coil_08", 0, "bit7"]
      - ["coil_09", 1, "bit0"]
      - ["coil_10", 1, "bit1"]
      - ["coil_11", 1, "bit2"]
      - ["coil_12", 1, "bit3"]
      - ["coil_13", 1, "bit4"]
      - ["coil_14", 1, "bit5"]
      - ["coil_15", 1, "bit6"]
      - ["coil_16", 1, "bit7"]
  - type: holding_register
    start_address: 40000
    size: 44
    byte_order: big_endian
    word_order: big_endian
    references:
      - ["holding_01", 40000, "uint16"]
      - ["holding_02", 40001, "uint16"]
      - ["holding_03", 40002, "uint16"]
      - ["holding_04", 40003, "uint16"]
      - ["holding_05", 40004, "int16"]
      - ["holding_06", 40005, "int16"]
      - ["holding_07", 40006, "int16"]
      - ["holding_08", 40007, "int16"]
      - ["holding_09", 40008, "uint32"]
      - ["holding_10", 40010, "uint32"]
      - ["holding_11", 40012, "int32"]
      - ["holding_12", 40014, "int32"]
      - ["holding_13", 40016, "float32"]
      - ["holding_14", 40018, "float32"]
      - ["holding_15", 40020, "uint64"]
      - ["holding_16", 40024, "int64"]
      - ["holding_17", 40028, "float64"]
      - ["holding_18", 40032, "float64"]
      - ["holding_19", 40036, "string16"]
