[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modpoll-wot-modbus"
version = "0.1.0a1"
description = "Modpoll WoT Modbus configuration support"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools.package-data]
modpoll_wot_modbus = ["schemas/*.json"]
