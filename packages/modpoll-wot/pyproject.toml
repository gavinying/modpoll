[tool.poetry]
name = "modpoll-wot"
version = "0.1.0a1"
description = "WoT Modbus configuration interpreter for Modpoll"
authors = ["Ying Shaodong <helloysd@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/top-maker/modpoll"
documentation = "https://top-maker.github.io/modpoll/v2/"
packages = [{ include = "modpoll_wot" }]
include = ["CONTRACT.md", "modpoll_wot/schemas/*.json", "modpoll_wot/schemas/SOURCES.md"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
jsonschema = ">=4.18,<5"
referencing = ">=0.28.4,<1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
