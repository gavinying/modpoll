services:
  modpoll:
    build: .
    depends_on:
      - modsim
      - mosquitto
    volumes:
      - ./examples/modsim.tm.json:/app/config/modsim.tm.json:ro
    command: >
      modpoll --daemon --tcp modsim --tcp-port 5020
        --mqtt-host mosquitto
        --mqtt-publish-topic-pattern modpoll/{{device_name}}/data
        --mqtt-qos 1 --rate 10 --timestamp
        --config /app/config/modsim.tm.json

  modsim:
    image: topmaker/modsim:latest
    ports:
      - "127.0.0.1:5020:5020"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:18883:1883"
