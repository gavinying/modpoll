[tool.poetry]
name = "modpoll"
version = "2.0.0a1"
description = "A New Command-line Tool for Modbus and MQTT"
authors = ["Ying Shaodong <helloysd@gmail.com>"]
repository = "https://github.com/top-maker/modpoll"
documentation = "https://top-maker.github.io/modpoll"
readme = "README.md"
packages = [{ include = "modpoll" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pymodbus = "~3.9.0"
paho-mqtt = "^2.1.0"
prettytable = "^3.9.0"
requests = "^2.32.5"
modpoll-wot = "==0.1.0a1"
pyserial = { version = "^3.5", optional = true }

[tool.poetry.extras]
serial = ["pyserial"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
pytest = "^8.2.2"
deptry = "^0.16.1"
tox = "^4.16.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=6,<8"
sphinx-argparse = "^0.3.1"
sphinx-rtd-theme = "^1.0.0"
sphinx-autobuild = "2021.3.14"
pandoc = "^2.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.deptry]
extend_exclude = ["packages"]
package_module_name_map = { pyserial = "serial" }

[tool.deptry.per_rule_ignores]
DEP002 = ["pyserial"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/modpoll-wot/tests"]
markers = ["integration: marks tests as integration tests"]

[tool.poetry.scripts]
modpoll = "modpoll.main:app"
