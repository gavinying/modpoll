[tox]
skipsdist = true
envlist = py310, py314

[gh-actions]
python =
    3.10: py310
    3.14: py314

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = poetry
commands =
    poetry install -v --all-extras
    poetry run pytest -m "not integration"
    poetry run python tools/test-wot-source.py -m "not integration"
