name: preview-core
on:
  push:
    tags: ['modpoll-wot-v*']
permissions:
  contents: read
concurrency:
  group: preview-core-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-poetry
      - name: Require an accepted v2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2
          python .github/scripts/preview-release.py guard "$TAG"
      - name: Verify interpreter source
        env:
          PYTHONPATH: packages/modpoll-wot
        run: poetry run pytest -q packages/modpoll-wot/tests
      - name: Build independent interpreter artifacts
        run: |
          rm -rf packages/modpoll-wot/dist
          cd packages/modpoll-wot
          poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: core-distributions
          path: packages/modpoll-wot/dist/*
      - name: Verify portable wheel and bundled schemas
        run: |
          python -m venv "$RUNNER_TEMP/core-check"
          "$RUNNER_TEMP/core-check/bin/pip" install packages/modpoll-wot/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core-check/bin/python" -m modpoll_wot validate "$GITHUB_WORKSPACE/packages/modpoll-wot/tests/fixtures/modsim-0.1.tm.json" --profile
          "$RUNNER_TEMP/core-check/bin/python" -m modpoll_wot validate "$GITHUB_WORKSPACE/packages/modpoll-wot/tests/fixtures/modsim-0.1.td.json" --profile
          "$RUNNER_TEMP/core-check/bin/python" -m modpoll_wot export "$GITHUB_WORKSPACE/examples/modsim.tm.json" --host 127.0.0.1 --port 5020 --output "$RUNNER_TEMP/core-check-instance.json"
          "$RUNNER_TEMP/core-check/bin/python" -m modpoll_wot validate "$RUNNER_TEMP/core-check-instance.json" --profile
      - name: Check immutable version
        id: pypi
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/preview-release.py pypi "$TAG"
      - name: Publish interpreter to PyPI
        if: steps.pypi.outputs.state == 'absent'
        working-directory: packages/modpoll-wot
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --no-interaction
      - name: Verify registry installation
        timeout-minutes: 15
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/core-registry"
          python .github/scripts/preview-release.py download "$TAG" --directory "$RUNNER_TEMP/core-registry-artifacts"
          "$RUNNER_TEMP/core-registry/bin/pip" install "$RUNNER_TEMP/core-registry-artifacts/modpoll_wot-${TAG#modpoll-wot-v}-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core-registry/bin/python" -m modpoll_wot validate "$GITHUB_WORKSPACE/packages/modpoll-wot/tests/fixtures/modsim-0.1.tm.json" --profile
          "$RUNNER_TEMP/core-registry/bin/python" -m modpoll_wot validate "$GITHUB_WORKSPACE/packages/modpoll-wot/tests/fixtures/modsim-0.1.td.json" --profile
          "$RUNNER_TEMP/core-registry/bin/python" -m modpoll_wot export "$GITHUB_WORKSPACE/examples/modsim.tm.json" --host 127.0.0.1 --output "$RUNNER_TEMP/core-registry-instance.json"
          "$RUNNER_TEMP/core-registry/bin/python" -m modpoll_wot validate "$RUNNER_TEMP/core-registry-instance.json" --profile
      - name: Record a separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title "modpoll-wot ${TAG#modpoll-wot-v}" --notes "Versioned configuration interpreter for the supported 0.1/0.2 contracts. Validates the bundled WoT TD/TM 1.1 schemas and Modpoll acquisition subset; does not execute device requests. See packages/modpoll-wot/CONTRACT.md at this tag."
          fi
          gh release upload "$TAG" packages/modpoll-wot/dist/*
