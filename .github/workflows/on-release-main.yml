name: release-main

on:
  release:
    types: [published]

concurrency:
  group: release-publish
  queue: max

jobs:
  build-and-publish-pypi:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Export tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check release tag eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          IMAGE_NAME: modpoll
          TAG: ${{ steps.vars.outputs.tag }}
        run: python .github/scripts/release_image_tags.py > "$RUNNER_TEMP/image-tags"

      - name: Build and publish to PyPI
        run: |
          python .github/scripts/check_release_version.py "$RELEASE_VERSION"
          make build-and-publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}

  publish-docker:
    runs-on: ubuntu-latest
    needs: build-and-publish-pypi
    outputs:
      latest: ${{ steps.image-tags.outputs.latest }}
      docs: ${{ steps.image-tags.outputs.docs }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Export tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify image version
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: python .github/scripts/check_release_version.py "$RELEASE_VERSION"

      - name: Select release image tags
        id: image-tags
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          IMAGE_NAME: modpoll
          TAG: ${{ steps.vars.outputs.tag }}
        run: python .github/scripts/release_image_tags.py > "$RUNNER_TEMP/image-tags"

      - name: Build and push Docker images
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          IMAGE_NAME: modpoll
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          args=()
          while IFS= read -r image; do args+=(-t "$image"); done < "$RUNNER_TEMP/image-tags"
          docker buildx build --platform linux/amd64,linux/arm64 "${args[@]}" --push .

  deploy-docs:
    needs: [build-and-publish-pypi, publish-docker]
    if: needs.publish-docker.outputs.docs == 'true'
    concurrency:
      group: modpoll-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Set up pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Build documentation
        run: make docs

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages

      - name: Preserve both documentation lines and vocabulary
        env:
          TAG: ${{ github.event.release.tag_name }}
          UPDATE_ROOT: ${{ needs.publish-docker.outputs.latest }}
        run: |
          mkdir .site
          rsync -a --exclude=.git .pages/ .site/
          line=v2
          if [[ "$TAG" == v1.* || "$TAG" == 1.* ]]; then line=1.x; fi
          args=()
          if [[ "$UPDATE_ROOT" == true ]]; then args+=(--root); fi
          python .github/scripts/assemble-docs.py docs/_build/html .site "$line" "${args[@]}"
          printf '%s\n' "$GITHUB_SHA" > ".site/$line/source-sha.txt"

      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .site
